name: Build AETHRA OS 2.0 - Lavender Official

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Vendor Aethra
        uses: actions/checkout@v4

      - name: Free up Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo apt clean
          df -h

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3 openjdk-11-jdk git-lfs repo

      - name: Init Repo & Sync
        run: |
          mkdir ~/aethra && cd ~/aethra
          repo init -u https://github.com/LineageOS/android -b lineage-20.0 --depth=1 --git-lfs
          repo sync -c --no-clone-bundle --no-tags -j$(nproc)

      - name: Clone Device & Vendor
        run: |
          cd ~/aethra
          git clone https://github.com/LineageOS/android_device_xiaomi_lavender -b lineage-20.0 device/xiaomi/lavender
          git clone https://github.com/LineageOS/android_device_xiaomi_sdm660-common -b lineage-20.0 device/xiaomi/sdm660-common
          git clone https://github.com/LineageOS/android_kernel_xiaomi_lavender -b lineage-20.0 kernel/xiaomi/lavender
          git clone https://github.com/TheMuppets/proprietary_vendor_xiaomi -b lineage-20.0 vendor/xiaomi
          rm -rf vendor/aethra
          git clone https://github.com/Otodidak07/vendor_aethra.git vendor/aethra
          cp -r vendor/aethra/banner.png vendor/aethra/icon.png device/xiaomi/lavender/

      - name: Build ROM
        run: |
          cd ~/aethra
          source build/envsetup.sh
          export USE_CCACHE=1
          ccache -M 20G
          lunch lineage_lavender-userdebug
          mka bacon -j$(nproc)

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AETHRA-OS-2.0-Lavender-OFFICIAL
          path: ~/aethra/out/target/product/lavender/*.zip

