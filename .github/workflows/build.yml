name: Build AETHRA OS 2.0 - Lavender Official
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build AETHRA
        run: |
          sudo apt update -y
          sudo apt install -y zip
          mkdir -p out/lavender
          echo "AETHRA OS 2.0 LAVENDER OFFICIAL by Otodidak07 $(date)" > out/lavender/INFO.txt
          cp -r . out/lavender/vendor 2>/dev/null || true
          cd out && zip -r AETHRA-OS-2.0-Lavender-OFFICIAL-${{ github.run_number }}.zip lavender/
          ls -lh
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: AETHRA-OS-2.0
          path: out/*.zip
